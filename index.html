  <style>
    :root {
      --charcoal:     #222222;
      --magenta:      #F00570;
      --teal:         #00B5C8;
      --gold:         #F5C800;
      --green:        #4CB87A;
      --white:        #FFFFFF;
      --border:       #e8e8e8;
      --bg:           #fafafa;
      --magenta-tint: rgba(240, 5, 112, 0.10);
      --teal-tint:    rgba(0, 181, 200, 0.10);
      --gold-tint:    rgba(245, 200, 0, 0.10);
      --green-tint:   rgba(76, 184, 122, 0.10);
      --magenta-dark: #a00048;
      --teal-dark:    #007a87;
      --gold-dark:    #7a6400;
      --green-dark:   #2a7a4e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: var(--charcoal) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><text x='100' y='90' font-size='80' text-anchor='middle'>🦚</text></svg>") no-repeat center 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 400;
      background: var(--white);
      color: var(--charcoal);
      min-height: 100vh;
    }

    /* ---- HEADER ---- */
    .header {
      background: var(--charcoal);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--magenta), var(--teal));
      flex-shrink: 0;
    }

    .logo-name {
      font-family: Georgia, serif;
      font-size: 14px;
      color: white;
      line-height: 1.1;
    }

    .logo-sub {
      font-size: 9px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 1.5px;
    }

    .nav-tabs {
      display: flex;
      gap: 2px;
      margin-left: auto;
    }

    .nav-tab {
      padding: 6px 16px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .nav-tab:hover { background: rgba(255,255,255,0.08); color: white; }
    .nav-tab.active { background: rgba(255,255,255,0.14); color: white; }

    /* ---- MAIN ---- */
    .main { padding: 24px; max-width: 1280px; margin: 0 auto; }

    /* ---- PAGE TITLE ---- */
    .page-title { font-family: Georgia, serif; font-size: 16px; font-weight: 400; }

    /* ---- SECTION LABEL ---- */
    .sec-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 500;
      color: #999;
    }

    /* ---- PILLS / FILTERS ---- */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .pill-group { display: flex; gap: 4px; }

    .pill {
      padding: 5px 13px;
      border-radius: 20px;
      border: 0.5px solid var(--border);
      background: white;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      color: var(--charcoal);
      transition: all 0.12s;
    }
    .pill:hover { border-color: #bbb; }
    .pill.am { background: var(--magenta-tint); border-color: rgba(240,5,112,0.3); color: var(--magenta-dark); }
    .pill.at { background: var(--teal-tint); border-color: rgba(0,181,200,0.3); color: var(--teal-dark); }

    .filter-sep { width: 1px; background: var(--border); height: 22px; align-self: center; }

    /* ---- SUMMARY CARDS ---- */
    .summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }

    .s-card {
      border-radius: 12px;
      padding: 14px 16px;
      border: 0.5px solid var(--border);
    }
    .s-card.sc { background: var(--charcoal); border-color: transparent; }
    .s-card.sm { background: var(--magenta-tint); border-color: rgba(240,5,112,0.15); }
    .s-card.st { background: var(--teal-tint); border-color: rgba(0,181,200,0.15); }
    .s-card.sg { background: var(--gold-tint); border-color: rgba(245,200,0,0.15); }

    .s-card .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1.1px; font-weight: 500; margin-bottom: 8px; }
    .s-card.sc .lbl { color: rgba(255,255,255,0.5); }
    .s-card.sm .lbl { color: var(--magenta-dark); }
    .s-card.st .lbl { color: var(--teal-dark); }
    .s-card.sg .lbl { color: var(--gold-dark); }

    .s-card .val { font-family: Georgia, serif; font-size: 22px; }
    .s-card.sc .val { color: white; }
    .s-card.sm .val { color: var(--magenta-dark); }
    .s-card.st .val { color: var(--teal-dark); }
    .s-card.sg .val { color: var(--gold-dark); }

    .s-card .sub { font-size: 11px; margin-top: 4px; color: var(--green-dark); }

    /* ---- MONTH GROUPS ---- */
    .month-group { margin-bottom: 24px; }

    .month-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 2px;
    }

    .month-name { font-family: Georgia, serif; font-size: 14px; }
    .month-meta { font-size: 11px; color: #aaa; }

    /* ---- PAZAR TABLE ---- */
    .pt { width: 100%; border-collapse: collapse; }
    .pt th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 500;
      color: #aaa;
      padding: 6px 10px;
      text-align: left;
      border-bottom: 0.5px solid var(--border);
    }
    .pt td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); font-size: 12px; }
    .pt tr:hover td { background: var(--bg); cursor: pointer; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .tag.m { background: var(--magenta-tint); color: var(--magenta-dark); }
    .tag.t { background: var(--teal-tint); color: var(--teal-dark); }

    .bld { font-weight: 500; }
    .grn { color: var(--green-dark); font-weight: 500; }
    .muted { color: #ccc; }

    /* ---- FORMA ---- */
    .forma-wrap { display: grid; grid-template-columns: 1fr 270px; gap: 24px; }

    .forma-group { margin-bottom: 20px; }

    .f-input {
      border: 0.5px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
      background: white;
      color: var(--charcoal);
    }
    .f-input:focus { border-color: #bbb; }

    .date-shortcuts { display: flex; gap: 6px; margin-top: 7px; }

    .sc-btn {
      padding: 4px 11px;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      background: white;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .sc-btn:hover { border-color: #bbb; }
    .sc-btn.active { border-color: var(--magenta); color: var(--magenta-dark); background: var(--magenta-tint); }

    .income-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .f-sub-label { font-size: 11px; color: #aaa; margin-bottom: 5px; }

    .promet-bar {
      background: var(--charcoal);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .promet-bar .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); }
    .promet-bar .val { font-family: Georgia, serif; font-size: 18px; color: white; }

    .uplatiti-bar {
      background: var(--green-tint);
      border: 0.5px solid rgba(76,184,122,0.25);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .uplatiti-bar .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--green-dark); }
    .uplatiti-bar .val { font-family: Georgia, serif; font-size: 18px; color: var(--green-dark); }

    .save-btn {
      width: 100%;
      padding: 11px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .save-btn:hover { opacity: 0.82; }

    /* Active rashodi */
    .ar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .ar-group {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--gold-tint);
      color: var(--gold-dark);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .ar-input {

    /* Sidebar rashodi */
    .sidebar-r {
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: sticky;

    }

      padding: 11px 14px;

      text-transform: uppercase;

    }

    .rg-title {
      font-size: 10px;
      text-transform: uppercase;

      color: #bbb;
      margin-bottom: 7px;
      margin-top: 14px;
    }

    .r-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 2px; }

    .r-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;

      font-size: 11px;
      cursor: pointer;
      font-family: inherit;

    }
    .r-chip:hover { border-color: var(--gold); background: var(--gold-tint); }
    .r-chip.dis { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .r-chip-plus { color: #bbb; font-size: 14px; line-height: 1; }
    .r-chip-wrap { display: inline-flex; align-items: center; gap: 2px; }
    .r-pin-btn { background: none; border: none; cursor: pointer; font-size: 11px; padding: 2px 3px; opacity: 0.2; transition: opacity 0.15s; line-height: 1; }
    .r-pin-btn:hover { opacity: 0.6; }
    .r-pin-btn.active { opacity: 1; }

    .new-r-row {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 0.5px solid var(--border);
    }

    /* Back / add buttons */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 20px;
      transition: border-color 0.12s;
    }
    .back-btn:hover { border-color: #aaa; }

    .add-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: Georgia, serif;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .add-btn-primary:hover { opacity: 0.82; }

    .del-btn {
      background: none;
      border: 0.5px solid #f8c0c8;
      border-radius: 6px;
      padding: 6px 12px;
      color: #c44;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .del-btn:hover { background: #fef0f0; }

    /* Date range */
    .dr { display: flex; gap: 8px; align-items: center; }
    .dr .f-input { width: 140px; }

    /* Empty state */
    .empty-hint { font-size: 12px; color: #bbb; padding: 6px 0; }

    /* Topbar */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    /* ---- RASPORED ---- */
    .raspored-layout { display: flex; gap: 16px; align-items: flex-start; }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .w-arrow {
      width: 28px; height: 28px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.12s;
    }
    .w-arrow:hover { border-color: #aaa; }
    .w-label { font-size: 13px; font-weight: 500; }

    .sched-wrap { flex: 1; overflow-x: auto; }

    .sched-table { width: 100%; border-collapse: collapse; font-size: 12px; }

    .sched-table th {
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: 0.5px solid var(--border);
    }
    .th-s1 { background: #ede9fe; color: #6d28d9; }
    .th-ms { background: var(--gold-tint); color: var(--gold-dark); }
    .th-s2 { background: var(--teal-tint); color: var(--teal-dark); }
    .th-n  { background: var(--bg); color: #aaa; }

    .sched-table td {
      padding: 7px 9px;
      border: 0.5px solid var(--border);
      vertical-align: middle;
      min-width: 90px;
    }

    .day-cell { min-width: 76px; }
    .day-dupe-warn {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 500;
      color: #b45309;
      background: #fef3c7;
      border: 0.5px solid #fcd34d;
      border-radius: 3px;
      padding: 1px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 74px;
    }
    .day-name { font-weight: 500; font-size: 12px; }
    .day-date { font-size: 11px; color: #aaa; margin-top: 1px; }

    .today-row td { font-weight: 700; }
    .today-row .day-cell { background: #f3f4f6; }
    .today-row .cell-click { background: #f3f4f6; }
    .today-row .cell-click.filled-s1 { background: #d8b4fe; }
    .today-row .cell-click.filled-s2 { background: #99f6e4; }
    .today-row .cell-click.filled-ms { background: #fde68a; }
    .today-row .cell-click.filled-off { background: #e2e8f0; }
    .today-row .cell-click .w-pill.s1 { background: #c4b5fd; }
    .today-row .cell-click .w-pill.s2 { background: #5eead4; }
    .today-row .cell-click .w-pill.ms { background: #fcd34d; }
    .today-row .note-input { background: #f3f4f6; font-weight: 700; }

    .w-pills { display: flex; flex-wrap: nowrap; gap: 3px; justify-content: center; }
    .w-pill {
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
      color: #111;
    }
    .w-pill.s1 { background: #e9d5ff; }
    .w-pill.ms { background: #fef9c3; }
    .w-pill.s2 { background: #ccfbf1; }
    .w-pill.off { background: #f1f5f9; color: #555; }

    .cell-click {
      cursor: pointer;
      text-align: center;
      vertical-align: middle;
    }
    .cell-click:hover { background: rgba(0,0,0,0.025); }
    .cell-click.filled-s1 { background: #f5f3ff; }
    .cell-click.filled-s2 { background: #f0fdf9; }
    .cell-click.filled-ms { background: #fefce8; }
    .cell-click.filled-off { background: #f8fafc; }
    .muted-cell { color: #ccc; }

    /* Cell editor */
    .ce-overlay {
      position: fixed; inset: 0; z-index: 200;
    }
    .ce-box {
      position: fixed;
      background: white;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      z-index: 201;
      min-width: 200px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .ce-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .ce-close-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 16px; line-height: 1; padding: 0 2px; margin-left: auto; flex-shrink: 0; }
    .ce-close-btn:hover { color: #666; }
    .radnik-add-btn { border: 0.5px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; font-family: inherit; cursor: pointer; background: var(--teal-tint); color: var(--teal-dark); font-weight: 600; line-height: 1.4; }
    .radnik-add-btn:hover { background: #c8e8e4; }
    .ce-field-label { color: var(--charcoal); font-weight: 500; background: var(--bg); border: 0.5px solid var(--border); border-radius: 4px; padding: 1px 6px; letter-spacing: 0.5px; }
    .ce-selected { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; min-height: 4px; }
    .ce-pill {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 20px;
      background: var(--teal-tint); color: var(--teal-dark);
      font-size: 11px;
    }
    .ce-pill-rm { background: none; border: none; cursor: pointer; color: var(--teal-dark); font-size: 12px; line-height: 1; padding: 0 1px; opacity: 0.6; }
    .ce-pill-rm:hover { opacity: 1; }
    .ce-input {
      width: 100%; border: 0.5px solid var(--border); border-radius: 5px;
      padding: 6px 10px; font-size: 12px; font-family: inherit;
      outline: none; margin-bottom: 4px;
    }
    .ce-input:focus { border-color: #bbb; }
    .ce-suggestions { max-height: 140px; overflow-y: auto; }
    .ce-suggestion {
      padding: 5px 8px; font-size: 12px; cursor: pointer;
      border-radius: 4px; transition: background 0.1s;
    }
    .ce-suggestion:hover,
    .ce-suggestion.active { background: var(--bg); }
    .ce-no-match { font-size: 11px; color: #ccc; padding: 4px 8px; }

    .note-input {
      border: none; background: transparent;
      font-size: 11px; color: #888;
      font-family: inherit; width: 100%; outline: none; min-width: 100px;
    }
    .note-input::placeholder { color: #ddd; }

    /* Radnici manager */
    .radnici-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .radnik-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border: 0.5px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      background: white;
    }
    .radnik-rm { background: none; border: none; cursor: pointer; color: #ccc; font-size: 12px; padding: 1px; }
    .radnik-rm:hover { color: #888; }
    .radnik-input {
      border: 0.5px solid var(--border);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      width: 120px;
    }

    /* Smene card */
    .smjene-card {
      width: 156px;
      flex-shrink: 0;
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: sticky;
      top: 68px;
    }
    .smjene-hdr {
      padding: 10px 12px;
      border-bottom: 0.5px solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #aaa;
    }
    .smena-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px;
      border-bottom: 0.5px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .smena-row:last-child { border-bottom: none; }
    .smena-row:hover { background: #f5f5f5; }
    .smena-row.done { background: var(--green-tint); }
    .smena-row.done .smena-name { color: var(--green-dark); }
    .smena-n { font-weight: 500; }
    .smena-paun { font-size: 14px; margin-left: 4px; }
    .smjene-total {
      background: var(--charcoal);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
    }

    /* Copy btn */
    .copy-btn {
      margin-top: 14px;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      background: white;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .copy-btn:hover { border-color: #aaa; }
    .copy-btn.ok { border-color: var(--green); color: var(--green-dark); }

    .paste-btn {
      padding: 6px 14px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      background: white;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      color: #555;
    }
    .paste-btn:hover { border-color: var(--teal); color: var(--teal-dark); }
    .paste-btn.ok { border-color: var(--green); color: var(--green-dark); }
    .paste-btn:disabled { opacity: 0.35; cursor: default; }

    .col-clear {
      padding: 3px 8px;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      background: white;
      font-size: 10px;
      cursor: pointer;
      font-family: inherit;
      color: #bbb;
      transition: all 0.12s;
    }
    .col-clear:hover { border-color: #e57373; color: #c62828; background: #fff5f5; }
    .col-clear:disabled { opacity: 0.25; cursor: default; }
    .tfoot-clear td { padding: 6px 9px; border: 0.5px solid var(--border); text-align: center; background: var(--bg); }

    select.f-input { appearance: none; cursor: pointer; }

    /* ---- PAZAR STATS ---- */
    .ps-summary { display: flex; gap: 12px; margin: 16px 0 24px; flex-wrap: wrap; }
    .ps-sum-card { flex: 1; min-width: 120px; border: 0.5px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .ps-sum-card.red { border-color: #fca5a5; background: #fff5f5; }
    .ps-sum-card.green { border-color: #86efac; background: #f0fdf4; }
    .ps-sum-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 4px; }
    .ps-sum-val { font-size: 18px; font-weight: 500; }

    .ps-cols { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
    .ps-section { flex: 1; min-width: 240px; margin-bottom: 24px; }
    .ps-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 12px; }
    .ps-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .ps-bar-label { width: 80px; font-size: 12px; }
    .ps-bar-track { flex: 1; height: 18px; background: #f3f4f6; border-radius: 4px; overflow: hidden; }
    .ps-bar-fill { height: 100%; border-radius: 4px; transition: width 0.35s ease; }
    .ps-bar-val { width: 90px; text-align: right; font-size: 12px; font-weight: 500; }

    .ps-trend { display: flex; align-items: flex-end; gap: 8px; padding: 8px 0; }
    .ps-trend-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .ps-trend-bars { display: flex; align-items: flex-end; gap: 3px; height: 88px; }
    .ps-trend-bar { width: 14px; border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.35s ease; }
    .ps-trend-bar.promet { background: #a78bfa; }
    .ps-trend-bar.rashodi { background: #f87171; }
    .ps-trend-lbl { font-size: 10px; color: #aaa; }
    .ps-trend-legend { display: flex; gap: 14px; margin-top: 8px; }

    /* ---- STATS ---- */
    .stats-toggle { padding: 5px 14px; border: 0.5px solid var(--border); border-radius: 20px; background: white; font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.12s; }
    .stats-toggle.active { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .stats-toggle:hover:not(.active) { border-color: #aaa; }

    .stats-wrap { padding: 4px 0 20px; }
    .stats-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .period-btn { padding: 4px 12px; border: 0.5px solid var(--border); border-radius: 20px; background: white; font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.12s; }
    .period-btn.active { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .period-btn:hover:not(.active) { border-color: #aaa; }
    .stats-period-lbl { font-size: 12px; color: #aaa; margin-left: 4px; }

    .stats-list { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
    .stat-row { display: grid; grid-template-columns: 18px 90px 1fr 60px 28px; align-items: center; gap: 10px; }
    .stat-rank { font-size: 11px; color: #bbb; text-align: right; }
    .stat-name { font-size: 13px; font-weight: 500; }
    .stat-bar { height: 22px; background: #f0f0f0; border-radius: 4px; display: flex; overflow: hidden; }
    .stat-seg { height: 100%; transition: width 0.35s ease; }
    .seg-s1 { background: #a78bfa; }
    .seg-s2 { background: #2dd4bf; }
    .seg-ms { background: #facc15; }
    .stat-breakdown { display: flex; gap: 6px; justify-content: flex-end; }
    .sb { font-size: 11px; font-weight: 500; min-width: 18px; text-align: center; }
    .sb.s1 { color: #6d28d9; }
    .sb.s2 { color: #0f766e; }
    .sb.ms { color: #a16207; }
    .stat-total { font-size: 14px; font-weight: 500; text-align: right; }

    .stats-legend { display: flex; gap: 16px; margin-top: 20px; }
    .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; }
    .leg-dot.s1 { background: #a78bfa; }
    .leg-dot.s2 { background: #2dd4bf; }
    .leg-dot.ms { background: #facc15; }

    .mobile-only { display: none; }

    /* ---- MOBILE ---- */
    @media (max-width: 768px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: block; }

      /* Pazar kartice — swipe-to-delete */
      .swipe-row {
        position: relative;
        overflow: hidden;
        touch-action: pan-y;
      }
      .swipe-delete-btn {
        position: absolute;
        right: 0; top: 0; bottom: 0;
        width: 76px;
        background: #ef4444;
        border: none;
        color: white;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-family: inherit;
        letter-spacing: 0.3px;
      }
      .swipe-delete-btn:active { background: #dc2626; }
      .pazar-card {
        padding: 13px 2px;
        border-bottom: 0.5px solid var(--border);
        cursor: pointer;
        background: white;
      }
      .pazar-card:active { background: var(--bg); }
      .pc-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
      .pc-date { font-size: 13px; font-weight: 500; }
      .pc-promet { font-family: Georgia, serif; font-size: 17px; }
      .pc-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
      .pc-chip { padding: 2px 8px; border-radius: 4px; font-size: 11px; }
      .pc-chip.m { background: var(--magenta-tint); color: var(--magenta-dark); }
      .pc-chip.t { background: var(--teal-tint); color: var(--teal-dark); }
      .pc-chip.n { background: var(--gold-tint); color: var(--gold-dark); }
      .pc-chip.r { background: #fef2f2; color: #c44; }
      .pc-uplatiti { font-size: 12px; color: var(--green-dark); }
      .pc-edit-hint { float: right; font-size: 12px; color: #ccc; margin-top: 2px; }
      .main { padding: 16px 12px; }

      /* Kartice jedna ispod druge, puna širina */
      .summary-cards { grid-template-columns: 1fr; }

      /* Forma — rashodi ispod, ne pored */
      .forma-wrap { grid-template-columns: 1fr; padding-bottom: 72px; }
      .sidebar-r { position: static; }

      /* Spremi dugme — fiksirano na dnu */
      .save-btn {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        border-radius: 0;
        padding: 16px;
        z-index: 50;
      }

      /* Sakrij desktop "Dodaj pazar" dugme */
      .hide-mobile { display: none !important; }

      /* Raspored — tab navigacija */
      .raspored-layout { flex-direction: column; }
      .sched-wrap { overflow-x: unset; }
      .smjene-card { display: none; }

      /* Trak sa danima */
      .day-strip {
        display: flex;
        overflow-x: auto;
        margin-bottom: 16px;
        border-bottom: 0.5px solid var(--border);
        scrollbar-width: none;
        gap: 0;
      }
      .day-strip::-webkit-scrollbar { display: none; }
      .day-strip-btn {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 14px 10px;
        border: none;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        position: relative;
        transition: color 0.12s;
      }
      .dsb-name { font-size: 12px; font-weight: 600; color: #aaa; }
      .dsb-date { font-size: 11px; color: #ccc; }
      .day-strip-btn.active .dsb-name { color: var(--charcoal); }
      .day-strip-btn.active .dsb-date { color: #888; }
      .day-strip-btn.dt-today .dsb-name { color: var(--teal-dark); }
      .day-strip-btn.dt-today .dsb-date { color: var(--teal-dark); opacity: 0.7; }
      .day-strip-btn::after {
        content: '';
        position: absolute;
        bottom: -0.5px; left: 10%; right: 10%;
        height: 2px;
        border-radius: 2px;
        background: transparent;
        transition: background 0.12s;
      }
      .day-strip-btn.active::after { background: var(--charcoal); }
      .day-strip-btn.dt-today.active::after { background: var(--teal); }

      /* Detalj izabranog dana */
      .day-detail {
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
      }

      /* Smene po radniku — mobile */
      .mobile-smene {
        border: 0.5px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .mobile-smene-hdr {
        padding: 9px 14px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: #aaa;
        border-bottom: 0.5px solid var(--border);
      }
      .mobile-smene-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 14px;
        font-size: 13px;
        border-bottom: 0.5px solid var(--border);
        cursor: pointer;
      }
      .mobile-smene-row.done { background: var(--green-tint); color: var(--green-dark); }
      .mobile-smene-n { font-weight: 600; font-size: 14px; }
      .mobile-smene-total {
        display: flex;
        justify-content: space-between;
        padding: 9px 14px;
        font-size: 12px;
        font-weight: 600;
        background: var(--charcoal);
        color: white;
      }
      .dc-section-lbl {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #bbb;
        margin: 8px 0 3px;
      }
      .dc-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 4px;
        border-radius: 5px;
        cursor: pointer;
        min-height: 30px;
      }
      .dc-row:active { background: var(--bg); }
      .dc-lbl { font-size: 11px; color: #999; min-width: 80px; }
      .dc-workers { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; align-items: center; }
      .dc-add { color: #ddd; font-size: 18px; line-height: 1; margin-left: 2px; }
      .dc-note {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 0.5px solid var(--border);
        width: 100%;
        border: none;
        outline: none;
        font-size: 12px;
        font-family: inherit;
        color: #888;
        background: transparent;
      }
      .dc-note::placeholder { color: #ddd; }

      /* Prostor ispod sadržaja da FAB ne prekriva zadnju karticu */
      .main-pregled { padding-bottom: 90px; }

      /* FAB — + dugme donje desno */
      .fab-add {
        position: fixed;
        bottom: 24px; right: 24px;
        width: 54px; height: 54px;
        border-radius: 50%;
        background: var(--charcoal);
        color: white;
        border: none;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 4px 18px rgba(0,0,0,0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
    }

    @media (min-width: 769px) {
      .fab-add { display: none; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .desktop-only { display: revert !important; }
      .mobile-only  { display: none   !important; }
      .raspored-layout { flex-direction: row; }
      .sched-wrap   { overflow-x: auto; }
      .smjene-card  { display: block; }
      .fab-add      { display: none; }
      .summary-cards { grid-template-columns: repeat(4, 1fr); }
      .forma-wrap   { grid-template-columns: 1fr 270px; padding-bottom: 0; }
      .sidebar-r    { position: sticky; }
      .save-btn     { position: static; border-radius: 6px; padding: 11px; }
      .main         { padding: 12px 20px; }
    }
  </style>
